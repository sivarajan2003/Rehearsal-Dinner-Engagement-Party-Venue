<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Admin Dashboard - Vowora</title>

  <link rel="icon" href="assets/fav1.png" type="image/png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            heading: ['"Montserrat"', 'sans-serif'],
            sans: ['"Roboto"', 'sans-serif'],
          },
          fontWeight: {
            regular: '400',
            medium: '500',
            semibold: '600',
            bold: '700',
            black: '900',
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Vowora Warm Elegant Palette */
    :root {
      --bg-color: #FDF6F2;
      --bg-secondary: #F9F1EC;
      --bg-card: #FFFFFF;
      --bg-inverted: #1F1613;
      --text-main: #2C1E1A;
      --text-muted: #6D5B53;
      --accent-color: #C26B4A;
      --accent-dark: #9E4E33;
      --border-color: #E8DDD7;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow-x: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    h1, h2, h3, h4, h5, h6, .brand-logo, .stat-value {
      font-family: 'Montserrat', sans-serif;
    }

    /* Dark Mode */
    body.dark-mode {
      --bg-color: #1A1310;
      --bg-secondary: #2B1F1A;
      --bg-card: #221A15;
      --bg-inverted: #000000;
      --text-main: #F5EDE8;
      --text-muted: #BCA89E;
      --accent-color: #D98B6B;
      --accent-dark: #C26B4A;
      --border-color: #3A2C26;
    }

    body.dark-mode .stat-card,
    body.dark-mode .chart-card,
    body.dark-mode .data-table,
    body.dark-mode .settings-form,
    body.dark-mode .instructor-card {
      background: var(--bg-card);
      border-color: var(--border-color);
    }

    body.dark-mode .stat-value,
    body.dark-mode .card-header h3,
    body.dark-mode .page-title h1,
    body.dark-mode .instructor-title,
    body.dark-mode .form-group label {
      color: var(--text-main);
    }

    body.dark-mode .stat-label,
    body.dark-mode .page-title p,
    body.dark-mode .instructor-detail,
    body.dark-mode .activity-time {
      color: var(--text-muted);
    }

    body.dark-mode .stat-icon {
      background: rgba(217, 139, 107, 0.15);
    }

    body.dark-mode th,
    body.dark-mode td {
      color: var(--text-main);
      border-bottom-color: var(--border-color);
    }

    body.dark-mode .search-bar {
      background: var(--bg-card);
      border-color: var(--border-color);
    }

    body.dark-mode .search-bar input {
      background: transparent;
      color: var(--text-main);
    }

    body.dark-mode .action-btn {
      background: var(--bg-card);
      border-color: var(--border-color);
      color: var(--accent-color);
    }

    body.dark-mode .action-btn:hover {
      background: var(--accent-color);
      color: #1A1310;
    }

    body.dark-mode .status-completed { background: #14532d; color: #86efac; }
    body.dark-mode .status-pending { background: #78350f; color: #fde047; }
    body.dark-mode .status-processing { background: #1e3a8a; color: #93c5fd; }

    body.dark-mode .activity-icon {
      background: rgba(217, 139, 107, 0.15);
    }

    body.dark-mode .form-group input,
    body.dark-mode .form-group select {
      background: var(--bg-secondary);
      border-color: var(--border-color);
      color: var(--text-main);
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background-color: var(--bg-card);
      color: var(--text-main);
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      overflow-y: auto;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      transform: translateX(0);
      box-shadow: 2px 0 12px rgba(194, 107, 74, 0.05);
      border-right: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); z-index: 1001; }
      .sidebar.mobile-open { transform: translateX(0); }
    }

    .sidebar-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(31, 22, 19, 0.8);
      backdrop-filter: blur(4px);
      z-index: 999;
      transition: all 0.3s ease;
    }
    .sidebar-overlay.active { display: block; }
    body.sidebar-open { overflow: hidden; }

    .sidebar-header {
      padding: 1.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    @media (max-width: 768px) {
      .sidebar-header { padding-left: 4.5rem; }
      body.rtl-active .sidebar-header { padding-left: 1.5rem; padding-right: 4.5rem; }
    }

    .nav-menu { padding: 1.5rem 0; }
    .nav-item { list-style: none; margin-bottom: 0.5rem; }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1.5rem;
      color: var(--text-muted);
      text-decoration: none;
      transition: all 0.3s;
      font-weight: 600;
      cursor: pointer;
      border-radius: 0 12px 12px 0;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    body.rtl-active .nav-link { border-radius: 12px 0 0 12px; }

    .nav-link:hover {
      background: rgba(194, 107, 74, 0.08);
      color: var(--accent-color);
    }

    .nav-link.active {
      background: var(--accent-color);
      color: #FFFFFF;
    }

    .nav-link i { width: 24px; font-size: 1.1rem; }

    .sidebar-action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.75rem 1.5rem;
      margin: 1rem 0 1.5rem 0;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s;
      cursor: pointer;
      border-top: 1px solid var(--border-color);
      font-size: 0.95rem;
    }

    .sidebar-action-btn:hover {
      background: rgba(194, 107, 74, 0.08);
      color: var(--accent-color);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      margin-left: 280px;
      padding: 1.5rem 2rem;
      transition: margin-left 0.3s ease;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }

    @media (max-width: 768px) {
      .main-content {
        margin-left: 0;
        padding: 1rem;
        padding-top: 70px;
      }
    }

    /* RTL Support */
    body.rtl-active { direction: rtl; }

    body.rtl-active .sidebar {
      left: auto;
      right: 0;
      border-right: none;
      border-left: 1px solid var(--border-color);
    }

    body.rtl-active .main-content {
      margin-left: 0;
      margin-right: 280px;
    }

    @media (max-width: 768px) {
      body.rtl-active .main-content { margin-right: 0; }
      body.rtl-active .sidebar { transform: translateX(100%); }
      body.rtl-active .sidebar.mobile-open { transform: translateX(0); }
      body.rtl-active .menu-toggle { left: auto; right: 1rem; }
    }

    /* Mobile Menu Toggle */
    .menu-toggle {
      display: none;
      position: fixed;
      top: 1rem;
      left: 1rem;
      z-index: 1100;
      background: var(--accent-color);
      color: #FFFFFF;
      border: none;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      box-shadow: 0 4px 12px rgba(194, 107, 74, 0.25);
      transition: all 0.2s;
    }

    .menu-toggle:hover {
      transform: scale(1.05);
      background: var(--accent-dark);
    }

    @media (max-width: 768px) {
      .menu-toggle { display: flex; align-items: center; justify-content: center; }
    }

    /* Page Container */
    .page-container { display: none; animation: fadeIn 0.4s ease; }
    .page-container.active-page { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Top Header */
    .top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    @media (max-width: 768px) {
      .top-header { flex-direction: column; align-items: stretch; gap: 1rem; }
    }

    .page-title h1 {
      font-size: 2rem;
      font-weight: 600;
      color: var(--text-main);
      letter-spacing: -0.5px;
    }

    @media (max-width: 480px) { .page-title h1 { font-size: 1.6rem; } }

    .page-title p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    @media (max-width: 768px) {
      .header-actions { width: 100%; justify-content: flex-end; gap: 0.8rem; }
    }

    .search-bar {
      display: flex;
      align-items: center;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 30px;
      padding: 0.6rem 1.2rem;
      gap: 0.5rem;
      flex: 1;
      min-width: 180px;
      transition: border-color 0.3s;
    }

    .search-bar:focus-within { border-color: var(--accent-color); }

    @media (max-width: 768px) {
      .search-bar { width: 100%; }
      .search-bar input { width: 100%; }
    }

    .search-bar input {
      border: none;
      outline: none;
      font-size: 0.9rem;
      width: 200px;
      background: transparent;
      font-family: 'Roboto', sans-serif;
      color: var(--text-main);
    }

    .toggle-buttons { display: flex; gap: 0.5rem; }

    @media (max-width: 768px) { .toggle-buttons { justify-content: center; } }

    .icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .text-btn {
      font-size: 12px;
      font-weight: 700;
      width: auto;
      border-radius: 40px;
      padding: 0 16px;
      letter-spacing: 1px;
    }

    .icon-btn:hover {
      background: var(--accent-color);
      color: #FFFFFF;
      border-color: var(--accent-color);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      padding-left: 0.5rem;
      border-left: 1px solid var(--border-color);
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      background: var(--accent-color);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-weight: 700;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 1024px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .stats-grid { grid-template-columns: 1fr; gap: 1rem; } }

    .stat-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      transition: transform 0.3s;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .stat-card:hover {
      transform: translateY(-5px);
      border-color: var(--accent-color);
    }

    .stat-icon {
      width: 48px;
      height: 48px;
      background: rgba(194, 107, 74, 0.15);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .stat-icon i { font-size: 1.4rem; color: var(--accent-dark); }

    .stat-value {
      font-size: 2rem;
      font-weight: 900;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Charts Section */
    .charts-section {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 1024px) and (min-width: 769px) { .charts-section { grid-template-columns: 1.5fr 1fr; } }
    @media (max-width: 768px) { .charts-section { grid-template-columns: 1fr; gap: 1.2rem; } }

    .chart-card {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 0.5rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 0.8rem;
    }

    .card-header h3 {
      font-size: 1.2rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
    }

    /* Top Categories Items */
    .top-product-item { margin-bottom: 1.2rem; width: 100%; }

    .top-product-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .top-product-name {
      font-size: 0.9rem;
      font-weight: 700;
      font-family: 'Montserrat', sans-serif;
    }

    .top-product-sales {
      font-weight: 700;
      font-size: 0.85rem;
      color: var(--accent-dark);
    }

    .progress-bar-container {
      background: var(--bg-secondary);
      border-radius: 10px;
      height: 6px;
      width: 100%;
      overflow: hidden;
    }

    .progress-bar-fill {
      background: var(--accent-color);
      height: 100%;
      border-radius: 10px;
    }

    /* Tables */
    .data-table {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      margin-bottom: 2rem;
      overflow-x: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }

    table { width: 100%; border-collapse: collapse; min-width: 600px; }

    @media (max-width: 640px) {
      table { min-width: 100%; }
      th, td { padding: 0.8rem; font-size: 0.8rem; }
    }

    th, td {
      padding: 1rem;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      white-space: nowrap;
    }

    th {
      font-weight: 700;
      color: var(--text-muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-badge {
      display: inline-block;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status-completed { background: #dcfce7; color: #166534; }
    .status-pending { background: #fef9c3; color: #854d0e; }
    .status-processing { background: #dbeafe; color: #1e40af; }

    /* Staff & Venues Grid */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 640px) { .products-grid { grid-template-columns: 1fr; } }

    .instructor-card {
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .instructor-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(194, 107, 74, 0.10);
      border-color: var(--accent-color);
    }

    .product-image {
      height: 200px;
      background-size: cover;
      background-position: center;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
    }

    .product-info { padding: 1.2rem; }

    .instructor-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .product-price {
      color: var(--accent-dark);
      font-weight: 700;
      font-size: 1rem;
    }

    .instructor-detail {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Quick Actions */
    .quick-actions {
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    @media (max-width: 640px) { .quick-actions { flex-direction: column; gap: 0.8rem; } }

    .action-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.8rem;
      padding: 1rem;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-weight: 700;
      color: var(--text-main);
      transition: all 0.3s;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-size: 0.8rem;
      font-family: 'Montserrat', sans-serif;
    }

    .action-btn:hover {
      background: var(--accent-color);
      color: #FFFFFF;
      border-color: var(--accent-color);
    }

    /* Activity Items */
    .activity-item {
      display: flex;
      gap: 1rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border-color);
    }

    .activity-icon {
      width: 40px;
      height: 40px;
      background: rgba(194, 107, 74, 0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid rgba(194, 107, 74, 0.3);
    }

    .activity-icon i { color: var(--accent-dark); }

    .activity-content p {
      font-weight: 600;
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .activity-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: block;
      margin-top: 0.3rem;
      font-weight: 500;
    }

    /* Analytics Grid */
    .analytics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 1024px) { .analytics-grid { grid-template-columns: 1fr; } }

    /* Settings Form */
    .settings-form {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 2rem;
      border: 1px solid var(--border-color);
      max-width: 800px;
    }

    .form-group { margin-bottom: 1.5rem; }

    .form-group label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.5rem;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: inherit;
      transition: border-color 0.3s;
      background: var(--bg-secondary);
      color: var(--text-main);
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .save-btn {
      background: var(--accent-color);
      color: #FFFFFF;
      border: none;
      padding: 1rem 2rem;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-size: 0.85rem;
      font-family: 'Montserrat', sans-serif;
      transition: background 0.3s;
    }

    .save-btn:hover { background: var(--accent-dark); }

    @media (max-width: 640px) { .save-btn { width: 100%; } }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-secondary); }
    ::-webkit-scrollbar-thumb { background: var(--accent-color); border-radius: 3px; }

    .chart-card canvas { max-width: 100%; height: auto; }
  </style>
    <style>
        ::-webkit-scrollbar { display: none; }
        html { scrollbar-width: none; -ms-overflow-style: none;  }
    </style>
</head>
<body>
  <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="dashboard-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a href="index.html" class="text-3xl font-extrabold tracking-wide flex items-center gap-2 shrink-0" style="font-family: ui-serif, Georgia, serif; text-decoration: none;">
          <i class="fas fa-ring" style="color: var(--accent-color);"></i>
          <span style="color: var(--accent-color);">Vowora</span>
        </a>
      </div>
      <ul class="nav-menu">
        <li class="nav-item" data-page="dashboard"><a class="nav-link active"><i class="fas fa-chart-line"></i><span>Venue Overview</span></a></li>

    const studentsData = [
      { name: 'Alex & Jamie Morgan', email: 'alex.jamie@example.com', orders: 'The Venue Package', spent: 4800.00, status: 'Active' },

    const topCourseDemand = [
      { name: 'Signature — The Venue', sales: '142 Booked', percent: 85 },
      { name: 'Grand — The Forever', sales: '88 Booked', percent: 60 },
      { name: 'Intimate — The Vow', sales: '54 Booked', percent: 40 },

    const activitiesFeed = [
      { icon: 'calendar-check', text: 'New booking confirmed: Alex & Jamie for Aug 2 at Garden Pavilion.', time: '15 minutes ago' },
      { icon: 'utensils', text: 'Catering menu finalized — 4-course dinner + cocktail hour for 80 guests.', time: '2 hours ago' },
      { icon: 'file-invoice-dollar', text: 'Invoice INV-2026-092 ($1,200) paid by Alex & Jamie.', time: 'Yesterday, 3:20 PM' },
      { icon: 'seedling', text: 'Floral design approved by Emily & Ryan for Rooftop Terrace.', time: 'Jul 26, 2026' }
    ];

    let revenueChartInstance = null;

    // Toggle Functions
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
      localStorage.setItem('vowVenueAdmin_darkMode', document.body.classList.contains('dark-mode'));
      const darkIcon = document.getElementById('darkModeIconBtn');
      if (darkIcon) darkIcon.innerHTML = document.body.classList.contains('dark-mode') ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    function toggleRTL() {
      document.body.classList.toggle('rtl-active');
      localStorage.setItem('vowVenueAdmin_rtl', document.body.classList.contains('rtl-active'));
      const rtlBtn = document.getElementById('rtlIconBtn');
      if (rtlBtn) rtlBtn.innerHTML = document.body.classList.contains('rtl-active') ? 'RTL' : 'LTR';
    }

    function closeSidebar() {
      sidebar.classList.remove('mobile-open');
      overlay.classList.remove('active');
      document.body.classList.remove('sidebar-open');
    }

    function openSidebar() {
      sidebar.classList.add('mobile-open');
      overlay.classList.add('active');
      document.body.classList.add('sidebar-open');
    }

    window.showPage = function(pageId) {
      const pages = ['dashboard', 'orders', 'products', 'customers', 'analytics', 'settings'];
      pages.forEach(p => document.getElementById(`${p}-page`).classList.remove('active-page'));
      document.getElementById(`${pageId}-page`).classList.add('active-page');
      document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
      document.querySelector(`[data-page="${pageId}"] .nav-link`).classList.add('active');
      if (window.innerWidth <= 768) closeSidebar();
    };

    // Render Functions
    function renderDashboard() {
      const dashboardDiv = document.getElementById('dashboard-page');
      dashboardDiv.innerHTML = `
        <div class="top-header">
          <div class="page-title"><h1>Venue Overview</h1><p>Global operations and metric tracking for Vowora.</p></div>
          <div class="header-actions">
            <div class="search-bar"><i class="fas fa-search" style="color:var(--text-muted)"></i><input type="text" placeholder="Search clients, bookings..."></div>
            <div class="toggle-buttons">
              <button class="icon-btn" id="darkModeIconBtn"><i class="fas fa-moon"></i></button>
              <button class="icon-btn text-btn" id="rtlIconBtn">LTR</button>
            </div>
            <div class="user-profile"><div class="user-avatar"><i class="fas fa-user-shield"></i></div><span style="font-weight:700;">Sofia (Admin)</span></div>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-user-group"></i></div><div class="stat-value">302</div><div class="stat-label">Active Clients</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-sack-dollar"></i></div><div class="stat-value">$184.2k</div><div class="stat-label">YTD Revenue</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-champagne-glasses"></i></div><div class="stat-value">280+</div><div class="stat-label">Celebrations Hosted</div></div>
          <div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-value">4.9★</div><div class="stat-label">Client Rating</div></div>
        </div>
        <div class="quick-actions">
          <button class="action-btn" id="addStaffQuickBtn"><i class="fas fa-plus"></i> Add Venue</button>
          <button class="action-btn" onclick="showPage('orders');"><i class="fas fa-plus-circle"></i> Create Booking</button>
          <button class="action-btn"><i class="fas fa-bullhorn"></i> Broadcast Announcement</button>
        </div>
        <div class="charts-section">
          <div class="chart-card"><div class="card-header"><h3>Monthly Booking Revenue</h3><span style="color:var(--accent-dark); font-size:0.8rem; font-weight:700;">Last 6 Months</span></div><div style="width:100%; height: 220px; position:relative;"><canvas id="revenueChart"></canvas></div></div>
          <div class="chart-card"><div class="card-header"><h3>Package Popularity</h3></div><div id="topCourseDemand"></div></div>
        </div>
        <div class="data-table"><div class="card-header"><h3>Recent Event Bookings</h3><a href="#" style="color:var(--accent-dark); font-size:0.8rem; font-weight:700; text-transform:uppercase; letter-spacing:1px;" onclick="showPage('orders'); return false;">View All →</a></div><div id="recentTicketsTable"></div></div>
        <div class="chart-card"><div class="card-header"><h3>Recent Activity Feed</h3></div><div id="activityFeed"></div></div>
      `;

      document.getElementById('topCourseDemand').innerHTML = topCourseDemand.map(p => `<div class="top-product-item"><div class="top-product-header"><span class="top-product-name">${p.name}</span><span class="top-product-sales">${p.sales}</span></div><div class="progress-bar-container"><div class="progress-bar-fill" style="width: ${p.percent}%;"></div></div></div>`).join('');

      document.getElementById('recentTicketsTable').innerHTML = `<table><thead><tr><th>Booking ID</th><th>Client & Package</th><th>Venue · Event</th><th>Billed</th><th>Status</th></tr></thead><tbody>${ticketsData.slice(0,4).map(o => `<tr><td><strong style="color:var(--text-main)">${o.id}</strong></td><td>${o.customer}</td><td>${o.items}</td><td>$${o.total.toFixed(2)}</td><td><span class="status-badge status-${o.status.toLowerCase()}">${o.status}</span></td></tr>`).join('')}</tbody></table>`;

      document.getElementById('activityFeed').innerHTML = activitiesFeed.map(a => `<div class="activity-item"><div class="activity-icon"><i class="fas fa-${a.icon}"></i></div><div class="activity-content"><p>${a.text}</p><span class="activity-time">${a.time}</span></div></div>`).join('');

      const revCtx = document.getElementById('revenueChart')?.getContext('2d');
      if (revCtx) {
        if (revenueChartInstance) revenueChartInstance.destroy();
        revenueChartInstance = new Chart(revCtx, {
          type: 'line',
          data: { labels: ['Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug'], datasets: [{ label: 'Revenue ($)', data: [24000, 28500, 31000, 29000, 35000, 38200], borderColor: '#C26B4A', backgroundColor: 'rgba(194, 107, 74, 0.15)', fill: true, tension: 0.4 }] },
          options: { responsive: true, maintainAspectRatio: false }
        });
      }

      document.getElementById('darkModeIconBtn')?.addEventListener('click', toggleDarkMode);
      document.getElementById('rtlIconBtn')?.addEventListener('click', toggleRTL);
      document.getElementById('addStaffQuickBtn')?.addEventListener('click', () => alert('Venue onboarding modal opening...'));

    function renderOrders() {
      const totalYield = ticketsData.reduce((s, o) => s + o.total, 0);
      const pending = ticketsData.filter(o => o.status === 'Pending').length;
      const processing = ticketsData.filter(o => o.status === 'Processing').length;
      const completed = ticketsData.filter(o => o.status === 'Completed').length;
      document.getElementById('orders-page').innerHTML = `
        <div class="top-header"><div class="page-title"><h1>Event Bookings</h1><p>Manage all scheduled and confirmed celebrations across venues.</p></div><div class="header-actions"><div class="search-bar"><i class="fas fa-search" style="color:var(--text-muted)"></i><input type="text" placeholder="Search booking ID..."></div></div></div>
        <div class="stats-grid"><div class="stat-card"><div class="stat-icon"><i class="fas fa-hourglass"></i></div><div class="stat-value">${pending}</div><div class="stat-label">Pending Confirmation</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-champagne-glasses"></i></div><div class="stat-value">${processing}</div><div class="stat-label">In Planning</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-circle-check"></i></div><div class="stat-value">${completed}</div><div class="stat-label">Celebrated</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-dollar-sign"></i></div><div class="stat-value">$${totalYield.toLocaleString()}</div><div class="stat-label">Total Booking Yield</div></div></div>

      `;
    }

    function renderProducts() {
      document.getElementById('products-page').innerHTML = `
        <div class="top-header"><div class="page-title"><h1>Spaces & Venues</h1><p>Manage your curated venues, layouts, and capacities.</p></div><div class="header-actions"><button class="action-btn" id="addStaffBtn" style="width:auto;"><i class="fas fa-plus"></i> Add Space</button></div></div>
        <div class="products-grid" id="staffGrid"></div>
      `;
      const grid = document.getElementById('staffGrid');
      grid.innerHTML = staffData.map(p => `<div class="instructor-card"><div class="product-image" style="background-image:url('${p.image}');"></div><div class="product-info"><div class="instructor-title">${p.name}</div><div class="product-price">${p.title}</div><div class="instructor-detail">Status: <span style="color:var(--text-main); font-weight:700;">${p.status}</span></div><div class="instructor-detail" style="margin-top:2px;">Rating: ${p.rating}</div></div></div>`).join('');
      document.getElementById('addStaffBtn')?.addEventListener('click', () => alert('Venue onboarding modal opening...'));
    }

    function renderCustomers() {
      const total = studentsData.length, graduates = studentsData.filter(c => c.status === 'Celebrated').length, active = studentsData.filter(c => c.status === 'Active').length;
      document.getElementById('customers-page').innerHTML = `<div class="top-header"><div class="page-title"><h1>Client Roster</h1><p>Comprehensive client management system</p></div></div><div class="stats-grid"><div class="stat-card"><div class="stat-icon"><i class="fas fa-user-group"></i></div><div class="stat-value">302</div><div class="stat-label">Total Clients</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-champagne-glasses"></i></div><div class="stat-value">${graduates}</div><div class="stat-label">Celebrated</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-calendar-check"></i></div><div class="stat-value">${active}</div><div class="stat-label">Active Bookings</div></div><div class="stat-card"><div class="stat-icon"><i class="fas fa-star"></i></div><div class="stat-value">4.9★</div><div class="stat-label">Client Rating</div></div></div><div class="data-table"><table><thead><tr><th>Client Name</th><th>Contact Email</th><th>Package</th><th>Total Spend</th><th>Status</th></tr></thead><tbody>${studentsData.map(c => `<tr><td><strong style="color:var(--text-main)">${c.name}</strong></td><td>${c.email}</td><td>${c.orders}</td><td>$${c.spent.toFixed(2)}</td><td><span class="status-badge ${c.status === 'Celebrated' ? 'status-completed' : 'status-processing'}">${c.status}</span></td></tr>`).join('')}</tbody></table></div>`;
    }

    function renderAnalytics() {
      document.getElementById('analytics-page').innerHTML = `<div class="top-header"><div class="page-title"><h1>Financials & Yield</h1><p>Yield breakdown and celebration outcome reports.</p></div></div><div class="analytics-grid"><div class="chart-card"><div class="card-header"><h3>Quarterly Booking Yield</h3></div><div style="height: 220px;"><canvas id="quarterlyChart"></canvas></div></div><div class="chart-card"><div class="card-header"><h3>Revenue by Package Category</h3></div><div style="height: 220px;"><canvas id="categoryChart"></canvas></div></div></div><div class="data-table"><div class="card-header"><h3>Top Revenue Generating Packages</h3></div><table><thead><tr><th>Package Name</th><th>Bookings</th><th>Total Yield</th><th>Growth</th></tr></thead><tbody>${topCourseDemand.map((p, i) => `<tr><td><strong style="color:var(--text-main); font-family:'Montserrat', sans-serif;">${p.name}</strong></td><td>${p.sales}</td><td>$${(65000 - (i * 9000)).toLocaleString()}</td><td style="color:#10b981; font-weight:700;">+${Math.floor(Math.random() * 12) + 8}%</td></tr>`).join('')}</tbody></table></div>`;

      const qCtx = document.getElementById('quarterlyChart')?.getContext('2d');
      if (qCtx) new Chart(qCtx, { type: 'bar', data: { labels: ['Q1', 'Q2', 'Q3', 'Q4'], datasets: [{ label: 'Yield ($)', data: [85000, 98000, 112000, 124000], backgroundColor: '#C26B4A' }] }, options: { responsive: true, maintainAspectRatio: false } });

      const catCtx = document.getElementById('categoryChart')?.getContext('2d');
      if (catCtx) new Chart(catCtx, { type: 'doughnut', data: { labels: ['The Vow', 'The Venue', 'The Forever', 'Bespoke'], datasets: [{ data: [50, 25, 15, 10], backgroundColor: ['#C26B4A', '#9E4E33', '#D98B6B', '#6D5B53'], borderColor: 'transparent' }] }, options: { responsive: true, maintainAspectRatio: false } });
    }

    function renderSettings() {
      document.getElementById('settings-page').innerHTML = `<div class="top-header"><div class="page-title"><h1>System Settings</h1><p>Manage venue parameters and branch details.</p></div></div><div class="settings-form"><h3 style="margin-bottom:1.5rem; font-family:'Montserrat', sans-serif; font-size:1.3rem; font-weight:800;">Venue Information</h3><div class="form-group"><label>Venue Title</label><input type="text" value="Vowora — Garden District"></div><div class="form-group"><label>Administrative Email</label><input type="email" value="admin@vowandvenue.com"></div><div class="form-group"><label>Base Currency</label><select><option>USD ($)</option><option>EUR (€)</option><option>GBP (£)</option></select></div><div class="form-group"><label>Event License Code</label><input type="text" value="VV-EVENT-884029-NY"></div><button class="save-btn" onclick="alert('Venue parameters updated.')">Save Changes</button></div>`;
    }

    // Navigation listener
    document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => showPage(item.getAttribute('data-page'))));

    // Mobile sidebar controls
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebarOverlay');
    menuToggle?.addEventListener('click', () => sidebar.classList.contains('mobile-open') ? closeSidebar() : openSidebar());
    overlay?.addEventListener('click', closeSidebar);

    // Load saved preferences
    if (localStorage.getItem('vowVenueAdmin_darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      const darkIcon = document.getElementById('darkModeIconBtn');
      if (darkIcon) darkIcon.innerHTML = '<i class="fas fa-sun"></i>';
    } else {
      const darkIcon = document.getElementById('darkModeIconBtn');
      if (darkIcon) darkIcon.innerHTML = '<i class="fas fa-moon"></i>';
    }
    if (localStorage.getItem('vowVenueAdmin_rtl') === 'true') document.body.classList.add('rtl-active');

    // Initialize pages
    renderDashboard();
    renderOrders();
    renderProducts();
    renderCustomers();
    renderAnalytics();
    renderSettings();

    setTimeout(() => {
      document.getElementById('darkModeIconBtn')?.addEventListener('click', toggleDarkMode);
      document.getElementById('rtlIconBtn')?.addEventListener('click', toggleRTL);
    }, 100);
  </script>
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            if (typeof Lenis !== 'undefined') {
                const lenis = new Lenis({
                    duration: 1.2,
                    easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
                    smooth: true,
                    smoothTouch: false,
                });
                function raf(time) {
                    lenis.raf(time);
                    requestAnimationFrame(raf);
                }
                requestAnimationFrame(raf);
            }
        });
    </script>
</body>
